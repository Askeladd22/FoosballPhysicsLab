name: Foosball root / frozen NEON11
on:
  push:
    branches: [main]
  pull_request:
jobs:
  foosball:
    name: Foosball (LUA)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit
      - name: Foosball syntax
        run: |
          set -e
          for f in main.lua conf.lua camera.lua renderer3d.lua model.lua layout.lua theme.lua mesh_art.lua rod_selector.lua tests/test_foosball*.lua tests/test_project_boot.lua; do
            luac5.4 -p "$f"
          done
      - name: Repository structure guard
        run: python3 tests/test_repository_layout.py
      - name: Offline model metadata tests
        run: |
          python3 tools/inspect_foosball_models.py --self-test
          python3 tools/bake_table_soccer.py --self-test
          python3 tools/import_table_soccer_3d.py --self-test
      - name: Foosball full headless suite
        run: |
          set -e
          for t in tests/test_project_boot.lua tests/test_foosball*.lua; do
            echo "::group::$t"
            ${{ matrix.lua }} "$t"
            echo "::endgroup::"
          done

  neon11-legacy:
    name: Frozen NEON11 (LUA)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit
      - name: Historic code syntax
        run: |
          set -e
          cd legacy/neon11
          for f in main.lua conf.lua src/*.lua tests/test_*.lua; do
            luac5.4 -p "$f"
          done
      - name: Complete frozen 11vs11 regression suite
        run: |
          set -e
          cd legacy/neon11
          for t in tests/test_*.lua; do
            echo "::group::$t"
            ${{ matrix.lua }} "$t"
            echo "::endgroup::"
          done

  native-3d-smoke:
    name: Real LÖVE GPU depth and shader smoke (synthetic meshes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native LÖVE and virtual display
        run: sudo apt-get update && sudo apt-get install -y love xvfb libgl1-mesa-dri
      - name: Create original synthetic geometry only (no third-party model)
        run: python3 tools/import_table_soccer_3d.py --fixture --output local_assets/3d
      - name: Run 12 real 3D frames AND prove visible pixels (no black screen)
        run: |
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 45s love . --frames=12 --require-3d --verify-3d-pixels

  ccby-glb-model:
    name: CC BY model importer (synthetic 103-part GLB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline converter Python dependencies
        run: python -m pip install -q 'trimesh>=4,<5' numpy
      - name: Real 103-component GLB structure and license gates
        run: python tools/test_foosball_glb_ccby.py

  native-ccby-table-smoke:
    name: True 3D / real CC BY GLB / visible pixels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native LÖVE and virtual GPU
        run: sudo apt-get update && sudo apt-get install -y love xvfb libgl1-mesa-dri
      - name: Convert the actual versioned CC BY 4.0 model to independent GPU rigs
        run: |
          test -f assets/models/foosball_table.glb
          python -m pip install -q 'trimesh>=4,<5' numpy
          python tools/import_foosball_glb_ccby.py assets/models/foosball_table.glb --output local_assets/3d
      - name: Verify actual GLB legs are BELOW the playfield
        run: python tools/test_foosball_model_upright.py local_assets/3d
      - name: SHOWCASE — original full table, real 4 supports and field
        run: |
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 90s love . --view=showcase --frames=12 --require-3d --verify-3d-pixels --verify-3d-field --verify-3d-legs --capture-3d-frame
      - name: Save actual showroom GPU frame
        if: always()
        run: |
          find "$HOME" -name foosball_3d_camera.png -type f -exec cp {} foosball_3d_showcase.png \;
          test -s foosball_3d_showcase.png
      - name: GAMEPLAY — zoomed field / real geometry visible
        run: |
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 90s love . --frames=12 --require-3d --verify-3d-pixels --verify-3d-field --capture-3d-frame
      - name: Save actual gameplay GPU frame
        if: always()
        run: |
          find "$HOME" -name foosball_3d_camera.png -type f -exec cp {} foosball_3d_gameplay.png \;
          test -s foosball_3d_gameplay.png
      - name: Diagnose actual native GPU frame colors and geometry
        if: always()
        run: |
          if [ -f foosball_3d_gameplay.png ]; then
            python -m pip install -q pillow
            python - <<'PY'
          from PIL import Image
          im=Image.open("foosball_3d_gameplay.png").convert("RGB")
          w,h=im.size
          print("NATIVE_LÖVE_SCREENSHOT",w,h)
          # Visual evidence from the actual GPU framebuffer, not a speculative
          # projection-only test. Dark rail '#', green pitch G, rod/player R/B.
          for row in range(28):
              sy=int((row+0.5)*h/28)
              chars=[]
              for col in range(65):
                  sx=int((col+0.5)*w/65)
                  r,g,b=im.getpixel((sx,sy))
                  if g>50 and g>r*1.35 and b>r*1.1: c="G"
                  elif r>65 and r>g*1.4 and r>b*1.1: c="R"
                  elif b>70 and b>r*1.4 and b>g*1.1: c="B"
                  elif max(r,g,b)<32: c="."
                  elif min(r,g,b)>130: c="W"
                  else: c="#"
                  chars.append(c)
              print("GPU_FRAME|"+ "".join(chars))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ccby-foosball-gameplay-and-showcase
          path: |
            foosball_3d_gameplay.png
            foosball_3d_showcase.png
          if-no-files-found: warn
