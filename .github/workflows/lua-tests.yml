name: Foosball root / frozen NEON11
on:
  push:
    branches: [main]
  pull_request:
jobs:
  foosball:
    name: Foosball (LUA)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit
      - name: Foosball syntax
        run: |
          set -e
          for f in main.lua conf.lua camera.lua renderer3d.lua model.lua layout.lua theme.lua mesh_art.lua rod_selector.lua tests/test_foosball*.lua tests/test_project_boot.lua; do
            luac5.4 -p "$f"
          done
      - name: Repository structure guard
        run: python3 tests/test_repository_layout.py
      - name: Offline model metadata tests
        run: |
          python3 tools/inspect_foosball_models.py --self-test
          python3 tools/bake_table_soccer.py --self-test
          python3 tools/import_table_soccer_3d.py --self-test
      - name: Foosball full headless suite
        run: |
          set -e
          for t in tests/test_project_boot.lua tests/test_foosball*.lua; do
            echo "::group::$t"
            ${{ matrix.lua }} "$t"
            echo "::endgroup::"
          done

  neon11-legacy:
    name: Frozen NEON11 (LUA)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit
      - name: Historic code syntax
        run: |
          set -e
          cd legacy/neon11
          for f in main.lua conf.lua src/*.lua tests/test_*.lua; do
            luac5.4 -p "$f"
          done
      - name: Complete frozen 11vs11 regression suite
        run: |
          set -e
          cd legacy/neon11
          for t in tests/test_*.lua; do
            echo "::group::$t"
            ${{ matrix.lua }} "$t"
            echo "::endgroup::"
          done

  native-3d-smoke:
    name: Real LÖVE GPU depth and shader smoke (synthetic meshes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native LÖVE and virtual display
        run: sudo apt-get update && sudo apt-get install -y love xvfb libgl1-mesa-dri
      - name: Create original synthetic geometry only (no third-party model)
        run: python3 tools/import_table_soccer_3d.py --fixture --output local_assets/3d
      - name: Run 12 real 3D frames AND prove visible pixels (no black screen)
        run: |
          env SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 45s love . --frames=12 --require-3d --verify-3d-pixels
